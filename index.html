<style>
/* Layout: phone column — wine-red masthead with Georgian ornament band, sticky category rail, bestseller strip, then category lists with weight + price on one baseline */
:root {
  --bg: #f8f2ef;
  --paper: #fffaf7;
  --ink: #2b1519;

  --line: #e7d8d3;

  --display: "Cormorant", "Georgia", "Times New Roman", serif;
  --body: "Commissioner", "Segoe UI", system-ui, sans-serif;
  --geo: "Noto Serif Georgian", "Sylfaen", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #170d10; --paper: #22141a; --ink: #f5e9e4; --muted: #bba1a3; --line: #3a252b;
    --wine: #5c1422; --wine-ink: #fbe9e3; --gold: #d9aa5f; --vine: #9cbc80; --chip: #2e1c22; --accent: #e2a35f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #170d10; --paper: #22141a; --ink: #f5e9e4; --muted: #bba1a3; --line: #3a252b;
  --wine: #5c1422; --wine-ink: #fbe9e3; --gold: #d9aa5f; --vine: #9cbc80; --chip: #2e1c22; --accent: #e2a35f;
  color-scheme: dark;
}
html:lang(ka) { --display: "Noto Serif Georgian", "Sylfaen", serif; --body: "Noto Sans Georgian", "Sylfaen", system-ui, sans-serif; }
html:lang(ka) .cat-head h2 { font-size: 1.4rem; line-height: 1.2; }
html:lang(ka) .bcard .bn { font-size: .95rem; line-height: 1.3; }
html:lang(ka) .name { font-size: .95rem; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--wine); }
.g { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.in { max-width: 600px; margin: 0 auto; }

/* masthead */
.mast { background: var(--wine); color: var(--wine-ink); }
.mast .in { padding-block: 14px 26px; position: relative; text-align: center; }
.lang { position: absolute; right: 0; top: 14px; display: inline-flex; border: 1px solid color-mix(in srgb, var(--wine-ink) 35%, transparent); border-radius: 999px; padding: 2px; }
.lang button { font: 700 .72rem var(--body); letter-spacing: .08em; border: 0; background: transparent; color: var(--wine-ink); opacity: .75; padding: 5px 11px; border-radius: 999px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--wine-ink); color: var(--wine); opacity: 1; }
.geo-word { font-family: var(--geo); font-size: .95rem; letter-spacing: .12em; color: var(--gold); margin: 34px 0 2px; }
.mast h1 { font-family: "Cormorant", "Georgia", serif; font-weight: 700; font-size: clamp(3rem, 15vw, 4.4rem); line-height: .9; margin: 0; letter-spacing: .02em; }
.mast .sub { margin: 10px 0 0; font-size: .74rem; letter-spacing: .24em; text-transform: uppercase; opacity: .85; font-weight: 600; }
.ornament { height: 14px; background:
  linear-gradient(135deg, var(--wine) 25%, transparent 25%) -7px 0/14px 14px,
  linear-gradient(225deg, var(--wine) 25%, transparent 25%) -7px 0/14px 14px,
  linear-gradient(315deg, var(--gold) 25%, transparent 25%) 0 0/14px 14px,
  linear-gradient(45deg, var(--gold) 25%, transparent 25%) 0 0/14px 14px;
  background-color: var(--bg); }

/* category rail */
.rail { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.rail .in { position: relative; }
.track { display: flex; gap: 6px; overflow-x: auto; padding-block: 10px; scrollbar-width: none; overscroll-behavior-x: contain; }
.track::-webkit-scrollbar { display: none; }
.rail .arr { display: none; }
@media (hover: hover) and (pointer: fine) {
  .rail .arr { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; width: 34px; height: 34px; padding: 0; border-radius: 999px;
    display: grid; place-items: center; font: 700 1.25rem/1 var(--body); color: var(--ink); background: var(--paper); border: 1px solid var(--line);
    box-shadow: 0 0 0 10px var(--bg), 0 2px 8px rgba(0,0,0,.12); cursor: pointer; transition: opacity .15s; }
  .rail .arr.l { left: 0; } .rail .arr.r { right: 0; }
  .rail .arr:hover { background: var(--wine); color: var(--wine-ink); border-color: var(--wine); }
  .rail .arr[hidden] { display: none !important; }
  .track { cursor: grab; }
  .track.drag { cursor: grabbing; user-select: none; }
  .track.drag button { pointer-events: none; }
}
.rail button { flex: none; font: 600 .82rem var(--body); color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 7px 13px; cursor: pointer; white-space: nowrap; }
.rail button[aria-current="true"] { background: var(--wine); color: var(--wine-ink); border-color: var(--wine); }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* bestsellers */
.best { margin-top: 22px; }
.label { font-size: .7rem; letter-spacing: .2em; text-transform: uppercase; font-weight: 700; color: var(--gold); margin: 0 0 8px; }
.best-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.bcard { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 8px 8px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.bcard .bn { font-family: var(--display); font-weight: 700; font-size: 1.12rem; line-height: 1.1; }
.bcard .bp { margin-top: auto; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.bcard .bw { font-size: .72rem; color: var(--muted); }

/* sections */
section.cat { margin-top: 30px; scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 64px); }
.cat-head { display: flex; align-items: baseline; gap: 12px; padding-bottom: 6px; border-bottom: 2px solid var(--ink); }
.cat-head h2 { font-family: var(--display); font-weight: 700; font-size: 1.9rem; line-height: 1; margin: 0; text-wrap: balance; }
.cat-head span { margin-left: auto; font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.cat-note { font-size: .8rem; color: var(--muted); margin: 8px 0 0; font-style: italic; }
.item { padding-block: 13px; border-bottom: 1px dashed var(--line); display: flex; gap: 12px; align-items: flex-start; }
.txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.thumb { flex: none; width: 78px; height: 78px; border-radius: 12px; object-fit: cover; background: var(--chip); }
.bimg { width: 100%; aspect-ratio: 1 / 1; max-width: 100%; border-radius: 10px; object-fit: cover; background: var(--chip); display: block; }
.row { display: flex; align-items: baseline; gap: 10px; }
.name { font-weight: 600; font-size: 1rem; min-width: 0; }
.dots { flex: 1; border-bottom: 1px dotted var(--muted); opacity: .45; transform: translateY(-4px); min-width: 12px; }
.price { white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 700; color: var(--accent); }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.w { font-size: .74rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tag { font-size: .66rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--vine); border: 1px solid currentColor; border-radius: 5px; padding: 0 6px; }
.tag.hot { color: var(--gold); }
.desc { margin: 0; font-size: .86rem; color: var(--muted); }

.thumb, .bimg { cursor: zoom-in; }
.lb { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  padding: calc(env(safe-area-inset-top, 0px) + 56px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) max(16px, env(safe-area-inset-left, 0px));

.lb.open { opacity: 1; }
.lb img { max-width: min(100%, 560px); max-height: 62vh; width: auto; height: auto; border-radius: 16px; object-fit: contain; transform: scale(.86); transition: transform .28s cubic-bezier(.2,.8,.2,1); box-shadow: 0 20px 60px rgba(0,0,0,.45); }

.lb .cap .w2 { font-size: .8rem; opacity: .7; }
.lb .cap p { margin: 0; font-size: .9rem; opacity: .85; }
.lb .x { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); right: max(14px, env(safe-area-inset-right, 0px)); width: 42px; height: 42px; border-radius: 999px; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.08); color: #fff; font-size: 1.4rem; line-height: 1; cursor: pointer; }
@media (prefers-reduced-motion: reduce) { .lb, .lb img { transition: none; } }
footer { margin-top: 40px; padding-block: 26px 40px; text-align: center; color: var(--muted); font-size: .8rem; border-top: 1px solid var(--line); }
footer .cheers { font-family: var(--display); font-size: 1.5rem; color: var(--ink); margin: 0 0 6px; font-weight: 700; }

footer p { margin: 4px 0; }
</style>
</head>

hmedia.io/image/global-menu-service/GV_BG/vendor/964165/product/42367495840/473ba0a2-bdec-4812-a1ce-111ff26e2ac3.jpg?t=W3sicmVzaXplIjp7Im1vZGUiOiJmaXQiLCJ3aWR0aCI6NjQwLCJoZWlnaHQiOjY0MH19XQ%3D%3D"], "Шашлик от пилешко": ["42367495843.jpg", "https://glovo.dhmedia.io/image/global-menu-service/GV_BG/vendor/964165/product/42367495843/663d43ad-58fa-49a2-8912-4fd442875df0.jpg?t=W3sicmVzaXplIjp7Im1vZGUiOiJmaXQiLCJ3aWR0aCI6NjQwLCJoZWlnaHQiOjY0MH19XQ%3D%3D"], "Люля кебап": ["42367495852.jpg", "https://glovo.dhmedia.io/image/global-menu-service/GV_BG/vendor/964165/product/42367495852/777ca945-29c1-4b45-b505-3461c9c41949.jpg?t=W3sicmVzaXplIjp7Im1vZGUiOiJmaXQiLCJ3aWR0aCI6NjQwLCJoZWlnaHQiOjY0MH19XQ%3D%3D"], "Ткемали": ["42367495844.jpg", "https://glovo.dhmedia.io/image/global-menu-service/GV_BG/vendor/964165/product/42367495844/b127f8a4-8849-4036-a925-90924248ac5b.jpg?t=W3sicmVzaXplIjp7Im1vZGUiOiJmaXQiLCJ3aWR0aCI6NjQwLCJoZWlnaHQiOjY0MH19XQ%3D%3D"], "Сацибели": ["42367495836.jpg", "https://glovo.dhmedia.io/image/global-menu-service/GV_BG/vendor/964165/product/42367495836/dee7f2f7-9d42-4f79-b4f7-94a3bf791c40.jpg?t=W3sicmVzaXplIjp7Im1vZGUiOiJmaXQiLCJ3aWR0aCI6NjQwLCJoZWlnaHQiOjY0MH19XQ%3D%3D"], "Торта „Медовик“": ["42367495866.jpg", "https://glovo.dhmedia.io/image/global-menu-service/GV_BG/vendor/964165/product/42367495866/418b1e03-d321-472b-9b00-b361bdd27988.jpg?t=W3sicmVzaXplIjp7Im1vZGUiOiJmaXQiLCJ3aWR0aCI6NjQwLCJoZWlnaHQiOjY0MH19XQ%3D%3D"], "Торта „Наполеон“": ["42367495834.jpg", "https://glovo.dhmedia.io/image/global-menu-service/GV_BG/vendor/964165/product/42367495834/83064b1a-a182-428a-bb21-55ecdf936b7d.jpg?t=W3sicmVzaXplIjp7Im1vZGUiOiJmaXQiLCJ3aWR0aCI6NjQwLCJoZWlnaHQiOjY0MH19XQ%3D%3D"], "Лимонада „Натахтари“ Круша": ["42367495853.jpg", "https://glovo.dhmedia.io/image/global-menu-service/GV_BG/vendor/964165/product/42367495853/6fc51412-015c-4f27-b4b7-037bfeb7bfb7.jpg?t=W3sicmVzaXplIjp7Im1vZGUiOiJmaXQiLCJ3aWR0aCI6NjQwLCJoZWlnaHQiOjY0MH19XQ%3D%3D"], "Лимонада „Натахтари“ Тархун": ["42367495842.jpg", "https://glovo.dhmedia.io/image/global-menu-service/GV_BG/vendor/964165/product/42367495842/edc25b86-eb9c-4e48-9d0b-8b3dcfc41eb4.jpg?t=W3sicmVzaXplIjp7Im1vZGUiOiJmaXQiLCJ3aWR0aCI6NjQwLCJoZWlnaHQiOjY0MH19XQ%3D%3D"], "Набеглави": ["42367495848.jpg", "https://glovo.dhmedia.io/image/global-menu-service/GV_BG/vendor/964165/product/42367495848/9be424a0-a0b2-4988-94c5-bec09365edfb.jpg?t=W3sicmVzaXplIjp7Im1vZGUiOiJmaXQiLCJ3aWR0aCI6NjQwLCJoZWlnaHQiOjY0MH19XQ%3D%3D"], "Твиши": ["42367495865.jpg", "https://glovo.dhmedia.io/image/global-menu-service/GV_BG/vendor/964165/product/42367495865/7ff7eec1-1848-418a-a34b-b71722107091.jpg?t=W3sicmVzaXplIjp7Im1vZGUiOiJmaXQiLCJ3aWR0aCI6NjQwLCJoZWlnaHQiOjY0MH19XQ%3D%3D"], "Киндзмараули": ["42367495857.jpg", "https://glovo.dhmedia.io/image/global-menu-service/GV_BG/vendor/964165/product/42367495857/04cf5511-e7a4-4a85-96f7-0155d685adca.jpg?t=W3sicmVzaXplIjp7Im1vZGUiOiJmaXQiLCJ3aWR0aCI6NjQwLCJoZWlnaHQiOjY0MH19XQ%3D%3D"], "Алазанска долина": ["42367495851.jpg", "https://glovo.dhmedia.io/image/global-menu-service/GV_BG/vendor/964165/product/42367495851/f52cee2d-868d-4dba-99cf-ee0c16f3eec1.jpg?t=W3sicmVzaXplIjp7Im1vZGUiOiJmaXQiLCJ3aWR0aCI6NjQwLCJoZWlnaHQiOjY0MH19XQ%3D%3D"], "Цинандали": ["42367495838.jpg", "https://glovo.dhmedia.io/image/global-menu-service/GV_BG/vendor/964165/product/42367495838/fc70599d-d133-4238-a680-41a56dacbdbb.jpg?t=W3sicmVzaXplIjp7Im1vZGUiOiJmaXQiLCJ3aWR0aCI6NjQwLCJoZWlnaHQiOjY0MH19XQ%3D%3D"], "Кока-Кола": ["coca-cola.jpg", "https://glovo.dhmedia.io/image/menus-glovo/products/ff76636ca623d7a759e0438021f1fe70037ce251d2f25b7483312b075bf51f63?t=W3sicmVzaXplIjp7Im1vZGUiOiJmaXQiLCJ3aWR0aCI6NjQwLCJoZWlnaHQiOjY0MH19XQ%3D%3D"], "Кока-Кола Зеро": ["coca-cola-zero.jpg", "https://glovo.dhmedia.io/image/menus-glovo/products/2d9874be64a39121a1b3d02cfc3508002ab3fdbfcc20582c674eb9918aac9326?t=W3sicmVzaXplIjp7Im1vZGUiOiJmaXQiLCJ3aWR0aCI6NjQwLCJoZWlnaHQiOjY0MH19XQ%3D%3D"]};
function photo(x, cls, loading) {
  const p = IMG[x[0]]; if (!p) return "";
  return `<img class="${cls}" data-key="${esc(x[0])}" src="img/${p[0]}" data-alt="${p[1]}" alt="${esc(nm(x))}" loading="${loading}" decoding="async" width="160" height="160" onerror="imgErr(this)">`;
}
function imgErr(el) { if (el.dataset.alt && !el.dataset.tried) { el.dataset.tried = "1"; el.src = el.dataset.alt; } else el.remove(); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const L = () => lang === "bg" ? 0 : lang === "en" ? 1 : 2;
const nm = x => lang === "ka" ? x.ka[0] : x[L()];
const ds = x => lang === "ka" ? x.ka[1] : x[5 + L()];
const amount = (n, u) => !u ? "" : `${n} ${UI[lang][u]}`;
const tags = f => f === "hot" ? `<span class="tag hot">${UI[lang].hot}</span>` : f === "made" ? `<span class="tag">${UI[lang].made}</span>` : "";

function render() {
  const u = UI[lang], i = L();
  document.documentElement.lang = lang;
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  document.getElementById("sub").textContent = u.sub;
  document.getElementById("bestLabel").textContent = u.best;
  document.getElementById("cheers").textContent = u.cheers;
  document.getElementById("cheers").hidden = !u.cheers;
  document.getElementById("foot1").textContent = u.foot1;
  document.getElementById("foot2").textContent = u.foot2;

  const best = MENU.flatMap(c => c.items.filter(x => x[7] === "hot"));
  document.getElementById("best").innerHTML = best.map(x => `<div class="bcard">${photo(x, "bimg", "eager")}
      <div class="bn">${esc(nm(x))}</div><div class="bw">${esc(amount(x[2], x[3]))}</div><div class="bp">${x[4]} €</div></div>`).join("");

  document.getElementById("rail").innerHTML = MENU.map(c => `<button type="button" id="nav-${c.id}" data-target="${c.id}">${esc(c.t[i])}</button>`).join("");
  document.getElementById("menu").innerHTML = MENU.map(c => `<section class="cat" id="${c.id}">
      <div class="cat-head"><h2>${esc(c.t[i])}</h2><span>${u.items(c.items.length)}</span></div>
      ${c.note ? `<p class="cat-note">${esc(c.note[i])}</p>` : ""}
      ${c.items.map(x => `<article class="item">${photo(x, "thumb", "lazy")}<div class="txt">
        <div class="row"><div class="name">${esc(nm(x))}</div><span class="dots" aria-hidden="true"></span><div class="price">${x[4]} €</div></div>
        <div class="meta">${x[3] ? `<span class="w">${esc(amount(x[2], x[3]))}</span>` : ""}${tags(x[7])}</div>
        ${ds(x) ? `<p class="desc">${esc(ds(x))}</p>` : ""}
      </div></article>`).join("")}
    </section>`).join("");

  document.querySelectorAll("#rail button").forEach(b => b.addEventListener("click", () => {
    document.getElementById(b.dataset.target).scrollIntoView({ block: "start" });
    setActive(b.dataset.target);
  }));
  setActive(activeId);
  observe();
}

let activeId = MENU[0].id, io;
function setActive(id) {
  activeId = id;
  document.querySelectorAll("#rail button").forEach(b => {
    const on = b.dataset.target === id;
    b.setAttribute("aria-current", on);
    if (on) { const r = b.parentElement; r.scrollTo({ left: b.offsetLeft - r.offsetLeft - r.clientWidth / 2 + b.clientWidth / 2, behavior: "smooth" }); }
  });
}
function observe() {
  if (io) io.disconnect();
  if (!("IntersectionObserver" in window)) return;
  io = new IntersectionObserver(es => {
    const vis = es.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
    if (vis[0]) setActive(vis[0].target.id);
  }, { rootMargin: "-80px 0px -65% 0px" });
  document.querySelectorAll("section.cat").forEach(s => io.observe(s));
}

document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("georgia-lang", lang); } catch (e) {}
  render();
}));
render();

// Category bar on desktop: mouse wheel scrolls it sideways, arrow buttons, click-and-drag
(() => {
  const r = document.getElementById("rail"), L = document.getElementById("railL"), R = document.getElementById("railR");
  const upd = () => { const max = r.scrollWidth - r.clientWidth - 2; L.hidden = r.scrollLeft <= 2; R.hidden = r.scrollLeft >= max; };
  r.addEventListener("scroll", upd, { passive: true }); window.addEventListener("resize", upd); setTimeout(upd, 300); upd();
  const step = () => Math.max(160, r.clientWidth * 0.7);
  L.addEventListener("click", () => r.scrollBy({ left: -step(), behavior: "smooth" }));
  R.addEventListener("click", () => r.scrollBy({ left: step(), behavior: "smooth" }));
  r.addEventListener("wheel", e => {
    if (Math.abs(e.deltaY) <= Math.abs(e.deltaX) || r.scrollWidth <= r.clientWidth) return;
    e.preventDefault(); r.scrollBy({ left: e.deltaY });
  }, { passive: false });
  let sx = 0, sl = 0, down = false, moved = false;
  r.addEventListener("pointerdown", e => { if (e.pointerType !== "mouse") return; down = true; moved = false; sx = e.clientX; sl = r.scrollLeft; });
  window.addEventListener("pointermove", e => { if (!down) return; const dx = e.clientX - sx; if (Math.abs(dx) > 5) { moved = true; r.classList.add("drag"); } if (moved) r.scrollLeft = sl - dx; });
  window.addEventListener("pointerup", () => { down = false; setTimeout(() => r.classList.remove("drag"), 0); });
  r.addEventListener("click", e => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
})();

// Tap a photo to open it large with the dish details; close by tapping, the × button, Esc or the phone's back button
const ITEMS = {}; MENU.forEach(c => c.items.forEach(x => { ITEMS[x[0]] = x; }));
const lb = document.getElementById("lb"), lbImg = document.getElementById("lbImg");
let lbOpen = false;
function openLb(el) {
  const x = ITEMS[el.dataset.key]; if (!x) return;
  lbImg.src = el.currentSrc || el.src; lbImg.alt = nm(x);
  document.getElementById("lbName").textContent = nm(x);
  document.getElementById("lbPrice").textContent = x[4] + " €";
  document.getElementById("lbW").textContent = amount(x[2], x[3]);
  document.getElementById("lbDesc").textContent = ds(x) || "";
  document.getElementById("lbClose").setAttribute("aria-label", lang === "bg" ? "Затвори" : lang === "ka" ? "დახურვა" : "Close");
  lb.hidden = false; document.documentElement.style.overflow = "hidden";
  requestAnimationFrame(() => requestAnimationFrame(() => lb.classList.add("open")));
  if (!lbOpen) { lbOpen = true; try { history.pushState({ lb: 1 }, ""); } catch (e) {} }
  document.getElementById("lbClose").focus({ preventScroll: true });
}
function closeLb(fromHistory) {
  if (!lbOpen) return;
  lbOpen = false; lb.classList.remove("open"); document.documentElement.style.overflow = "";
  setTimeout(() => { if (!lbOpen) lb.hidden = true; }, 230);
  if (!fromHistory) { try { if (history.state && history.state.lb) history.back(); } catch (e) {} }
}
document.addEventListener("click", e => {
  const img = e.target.closest("img.thumb, img.bimg");
  if (img) { openLb(img); return; }
  if (lbOpen && lb.contains(e.target)) closeLb(false);
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeLb(false); });
window.addEventListener("popstate", () => closeLb(true));
</script>
